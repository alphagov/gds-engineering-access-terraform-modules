name: Validate

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

# NOTE: This declaration defaults all GH other permissions to none.
# - Create subsequent permissions scoped to job only after confirming with a techlead
# - Declaration here follows the policy defined in ADR-EA007
permissions:
  contents: none # Set so other permissions take the value 'none' by default
  id-token: none # Prevent OIDC token generation (‘none’ is the default)
  packages: none # Prevent package access (‘none’ is the default)

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install terraform and dependencies
      uses: alphagov/gds-tech-and-security-github-actions/terraform/deps@e46e2a6408fa36c6d07980d469710abe9b4cee60 # v0.1.21

    - name: Run pre-commit
      uses: alphagov/gds-tech-and-security-github-actions/pre-commit@e46e2a6408fa36c6d07980d469710abe9b4cee60 # v0.1.21
